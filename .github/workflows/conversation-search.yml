name: conversation-search

on:
  pull_request:
    paths:
      - tools/conversation_search.py
      - tools/validate_conversation_search_corpus.py
      - tests/test_conversation_search.py
      - .github/workflows/conversation-search.yml
  workflow_dispatch:

concurrency:
  group: conversation-search-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, regression-research]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify search implementation
        shell: pwsh
        run: |
          python -m py_compile tools/conversation_search.py tools/validate_conversation_search_corpus.py
          if ($LASTEXITCODE -ne 0) { throw "py_compile failed" }
          python -m unittest tests.test_conversation_search -v
          if ($LASTEXITCODE -ne 0) { throw "conversation search tests failed" }
      - name: Validate protected downloaded corpus
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP "conversation-search-$env:GITHUB_RUN_ID.sqlite3"
          try {
            python tools/conversation_search.py --db $db index --downloads 'C:\Users\Lauri\Downloads'
            if ($LASTEXITCODE -ne 0) { throw "conversation corpus indexing failed" }
            python tools/validate_conversation_search_corpus.py --db $db
            if ($LASTEXITCODE -ne 0) { throw "old/new corpus search validation failed" }
          }
          finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $db, "$db-wal", "$db-shm"
          }
