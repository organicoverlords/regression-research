name: changelog-landing

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: changelog-landing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, regression-research]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify changelog and GitHub landing projection
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            python .github/scripts/check_changelog_landing.py --base-ref "origin/${{ github.base_ref }}"
          } else {
            python .github/scripts/check_changelog_landing.py --base-ref "HEAD^"
          }
