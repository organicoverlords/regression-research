name: changelog-landing

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify changelog and GitHub landing projection
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 .github/scripts/check_changelog_landing.py --base-ref "origin/${{ github.base_ref }}"
          else
            python3 .github/scripts/check_changelog_landing.py
          fi
