name: changelog-landing

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: changelog-landing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, regression-research]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify changelog and GitHub landing projection
        shell: pwsh
        run: |
          $event = "${{ github.event_name }}"
          $ref = "${{ github.ref }}"
          if ($event -eq "pull_request") {
            python .github/scripts/check_changelog_landing.py --base-ref "origin/${{ github.base_ref }}"
          } elseif ($event -eq "push" -and $ref -eq "refs/heads/main") {
            python .github/scripts/check_changelog_landing.py --base-ref "HEAD^"
          } else {
            python .github/scripts/check_changelog_landing.py --base-ref "origin/main"
          }
      - name: Validate assistant stack policy harnesses when changed
        shell: pwsh
        run: |
          $event = "${{ github.event_name }}"
          $ref = "${{ github.ref }}"
          if ($event -eq "pull_request") {
            $base = "origin/${{ github.base_ref }}"
          } elseif ($event -eq "push" -and $ref -eq "refs/heads/main") {
            $base = "HEAD^"
          } else {
            $base = "origin/main"
          }
          $changed = @(git diff --name-only "$base...HEAD")
          $stackChanged = @($changed | Where-Object {
            $_ -in @(
              'tools/capability_routing.py',
              'tests/fixtures/capability-routing-policy.json',
              'tests/test_capability_routing.py',
              'tools/instruction_provenance.py',
              'tests/fixtures/instruction-provenance-policy.json',
              'tests/test_instruction_provenance.py'
            )
          })
          if ($stackChanged.Count -eq 0) {
            Write-Output 'ASSISTANT_STACK_POLICY_SKIPPED'
            exit 0
          }

          python -m py_compile tools/capability_routing.py tools/instruction_provenance.py
          if ($LASTEXITCODE -ne 0) { throw 'assistant stack policy py_compile failed' }
          python -m unittest tests.test_capability_routing tests.test_instruction_provenance -v
          if ($LASTEXITCODE -ne 0) { throw 'assistant stack policy tests failed' }
          Write-Output 'ASSISTANT_STACK_POLICY_PROVEN'
      - name: Validate downloaded conversation search when changed
        shell: pwsh
        run: |
          $event = "${{ github.event_name }}"
          $ref = "${{ github.ref }}"
          if ($event -eq "pull_request") {
            $base = "origin/${{ github.base_ref }}"
          } elseif ($event -eq "push" -and $ref -eq "refs/heads/main") {
            $base = "HEAD^"
          } else {
            $base = "origin/main"
          }
          $changed = @(git diff --name-only "$base...HEAD")
          $conversationChanged = @($changed | Where-Object {
            $_ -in @(
              'tools/conversation_search.py',
              'tools/conversation_search_refresh.py',
              'tools/validate_conversation_search_corpus.py',
              'tests/test_conversation_search.py',
              'tests/test_conversation_search_refresh.py'
            )
          })
          if ($conversationChanged.Count -eq 0) {
            Write-Output 'CONVERSATION_SEARCH_SKIPPED'
            exit 0
          }

          python -m py_compile tools/conversation_search.py tools/conversation_search_refresh.py tools/validate_conversation_search_corpus.py
          if ($LASTEXITCODE -ne 0) { throw 'conversation search py_compile failed' }
          python -m unittest tests.test_conversation_search tests.test_conversation_search_refresh -v
          if ($LASTEXITCODE -ne 0) { throw 'conversation search tests failed' }

          $db = 'C:\Users\Lauri\Desktop\vault\.state\conversation-search\conversations.sqlite3'
          python tools/conversation_search_refresh.py --db $db
          if ($LASTEXITCODE -ne 0) { throw 'conversation corpus indexing failed' }
          python tools/validate_conversation_search_corpus.py --db $db
          if ($LASTEXITCODE -ne 0) { throw 'old/new corpus search validation failed' }
          Write-Output "CONVERSATION_SEARCH_CANONICAL_INDEX_PROVEN=$db"
